name: Compact CI

on:
  pull_request:
  push:
    branches: [main, agent/midnight-compact-native]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Compact
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.compact/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: npm ci
      - name: Compile Compact contract
        run: "$HOME/.compact/bin/compact" compile contract/src/aletheia.compact contract/src/managed/aletheia
      - name: Validate
        run: |
          npm run build
          npm test
          npm run typecheck
          npm run lint
      - uses: actions/upload-artifact@v4
        with:
          name: aletheia-compact-artifacts
          path: contract/src/managed/aletheia
          if-no-files-found: error
